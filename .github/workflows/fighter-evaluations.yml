name: Fighter evaluation experiments
on:
  push:
    branches: ['audit/3.3-fighter-decisions']
    paths: ['.github/workflows/fighter-evaluations.yml','scripts/fighter-evaluations.js','src/engine/targeting.js','src/engine/positioning.js','tests/engine-fighter-evaluations.test.js']
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        condition: [control, safety, engagement, threat]
        seed: [1, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/engine-fighter-evaluations.test.js
      - run: node scripts/fighter-evaluations.js ${{ matrix.condition }} ${{ matrix.seed }} 2 > evaluations.json
      - run: node -e "console.log(JSON.stringify(require('./evaluations.json').summary,null,2))"
      - uses: actions/upload-artifact@v4
        with:
          name: evaluations-${{ matrix.condition }}-${{ matrix.seed }}
          path: evaluations.json
