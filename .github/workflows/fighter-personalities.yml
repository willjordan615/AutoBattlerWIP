name: Fighter personality sweeps
on:
  push:
    branches: ['audit/3.3-fighter-decisions']
    paths: ['.github/workflows/fighter-personalities.yml','scripts/fighter-personalities.js','tests/engine-fighter-personalities.test.js']
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        condition: [control, threat-position, position-engagement-mid, position-safety-pressure]
        chassis: [bruiser, rogue, ranged]
        seed: [5, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/engine-fighter-personalities.test.js
      - run: node scripts/fighter-personalities.js ${{ matrix.condition }} ${{ matrix.chassis }} ${{ matrix.seed }} 2 > personalities.json
      - run: |
          node --input-type=module -e "import fs from 'node:fs';const s=JSON.parse(fs.readFileSync('personalities.json','utf8')).summary;console.log(JSON.stringify(s));"
      - uses: actions/upload-artifact@v4
        with:
          name: personalities-${{ matrix.condition }}-${{ matrix.chassis }}-${{ matrix.seed }}
          path: personalities.json
