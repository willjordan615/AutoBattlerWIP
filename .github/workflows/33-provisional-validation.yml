name: 3.3 provisional validation
on:
  push:
    branches: ['audit/3.3-fighter-decisions']
    paths: ['.github/workflows/33-provisional-validation.yml','scripts/33-playtest.js','tests/engine-33-production.test.js']
  workflow_dispatch:
jobs:
  matches:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [baseline, candidate]
        mode: [strategic, random]
        seed: [3301, 3401]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.version == 'baseline' && '3ef60f187580fdc5b5305fb48191a691032c197d' || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/balance-report.js 16 ${{ matrix.mode }} ${{ matrix.seed }} --json > balance.json
      - run: |
          node --input-type=module -e "import fs from 'node:fs';const r=JSON.parse(fs.readFileSync('balance.json'));if(r.completed!==r.config.matches)process.exitCode=1;console.log(JSON.stringify({config:r.config,completed:r.completed,combat:r.combat,startingChassis:r.startingChassis,modules:r.modules.filter(m=>m.module.startsWith('target:')),flags:r.flags}));"
      - uses: actions/upload-artifact@v4
        with:
          name: balance-${{ matrix.version }}-${{ matrix.mode }}-${{ matrix.seed }}
          path: balance.json
  play:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [baseline, candidate]
    steps:
      - uses: actions/checkout@v4
      - run: cp scripts/33-playtest.js /tmp/33-playtest.js
      - if: matrix.version == 'baseline'
        uses: actions/checkout@v4
        with:
          ref: '3ef60f187580fdc5b5305fb48191a691032c197d'
      - run: cp /tmp/33-playtest.js scripts/33-playtest.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/33-playtest.js 3301 > play.json
      - run: |
          node --input-type=module -e "import fs from 'node:fs';const r=JSON.parse(fs.readFileSync('play.json'));console.log(JSON.stringify({completed:r.completed,games:r.games.map(g=>({seed:g.seed,starting:g.starting,winner:g.winner,rounds:g.rounds,timeouts:g.timeouts,picks:g.picks.map(({round,card,slot})=>({round,card,slot})),finalSquad:g.finalSquad,roundsSummary:g.roundReports.map(r=>({round:r.round,arena:r.arena,ranking:r.ranking,remaining:r.remaining,telemetry:r.telemetry.byOwner[0]}))}))}));"
      - uses: actions/upload-artifact@v4
        with:
          name: play-${{ matrix.version }}
          path: play.json
