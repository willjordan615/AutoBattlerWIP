name: Fighter decision audit
on:
  push:
    branches: ['audit/3.3-fighter-decisions']
    paths: ['.github/workflows/fighter-decision-audit.yml', 'scripts/fighter-decision-audit.js', 'src/engine/**']
  workflow_dispatch:
jobs:
  observe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/engine-decision-audit.test.js
      - run: node scripts/fighter-decision-audit.js 1 ${{ matrix.seed }} 1 --json > decision-audit.json
      - run: |
          node --input-type=module -e "import fs from 'node:fs';const r=JSON.parse(fs.readFileSync('decision-audit.json','utf8'));console.log(JSON.stringify({config:r.config,parity:r.parity,fixtureRounds:r.fixtureRounds,matchRounds:r.matchRounds,byChassis:r.byChassis,fixtureTimeouts:r.rounds.filter(x=>x.timeout).length,matchTimeouts:r.matchReports.flatMap(m=>m.rounds).filter(x=>x.timeout).length},null,2));"
      - uses: actions/upload-artifact@v4
        with:
          name: decision-audit-seed-${{ matrix.seed }}
          path: decision-audit.json
