name: Node tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run verify:parity -- 9416d7c130a7e40838822f5594800caaeb47dff4
      - run: npm test
      - run: node scripts/agent-playtest.js 12 1

      - run: node scripts/navigation-diagnostics.js 8 1
