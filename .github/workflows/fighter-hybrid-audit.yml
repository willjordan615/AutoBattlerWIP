name: Fighter hybrid preference audit
on:
  push:
    branches: ['audit/3.3-fighter-decisions']
    paths: ['.github/workflows/fighter-hybrid-audit.yml','scripts/fighter-hybrid-audit.js','tests/engine-fighter-hybrid.test.js']
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        condition: [threat-position, position-engagement-mid]
        chassis: [bruiser, rogue, ranged]
        card: [aggressor, duelist, guardian]
        seed: [9, 11]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/engine-fighter-hybrid.test.js tests/engine-fighter-personalities.test.js
      - run: node scripts/fighter-hybrid-audit.js ${{ matrix.condition }} ${{ matrix.chassis }} ${{ matrix.card }} ${{ matrix.seed }} 2 > hybrid.json
      - run: |
          node --input-type=module -e "import fs from 'node:fs';const s=JSON.parse(fs.readFileSync('hybrid.json','utf8')).summary;const keys=['rank','survived','hp','damage','taken','exposure','safeAccess','missedAccess','releasesPerSecond','isolationDistance','singletonSelection','allyThreatSelection','timeout','stall'];for(const g of Object.values(s.groups))for(const c of Object.values(g))c.metrics=Object.fromEntries(keys.filter(k=>c.metrics[k]).map(k=>[k,c.metrics[k]]));console.log(JSON.stringify(s));"
      - uses: actions/upload-artifact@v4
        with:
          name: hybrid-${{ matrix.condition }}-${{ matrix.chassis }}-${{ matrix.card }}-${{ matrix.seed }}
          path: hybrid.json
